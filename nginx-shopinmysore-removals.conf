# Recommended Nginx snippets for the ShopInMysore.in redesign.
# Add known legacy URLs from Google Search Console to the map and return 410.
# Do not blanket-410 every unknown URL unless you are certain it was removed.

map $uri $gone_legacy_url {
    default 0;
    # Examples:
    # /old-page.html 1;
    # /category/old-business 1;
}

server {
    server_name shopinmysore.in www.shopinmysore.in;
    root /var/www/shopinmysore.in;
    index index.html;

    if ($gone_legacy_url) {
        return 410;
    }

    error_page 410 /410;
    location = /410 {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }

    location ~* \.(?:css|js|woff2|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
